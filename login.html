<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman login</title>
</head>
<body>
    <h2>Login sistem</h2>
    <label>username</label>
    <input type="text" id="username"><br>
    <label>password</label>
    <input type="password" id="password"><br>
    <button onclick="login()">login</button>
    <p id="hasil"></p>
    <script>
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById
            ("password").value;
            if (username == "admin" && password == "admin123"){window.location.href = "admin.html";
            } else if (username == "dosen" && password == "dosen111"){window.location.href = "dosen.html";
            } else if (username == "mahasiswa" && password == "mahasiswa123"){window.location.href = "mahasiswa.html";
            } else {
                document.getElementById("hasil").innerHTML = "username atau password salah"
            }
        }
    </script>
</body>
</html>
